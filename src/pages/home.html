<main
	class="relative isolate min-h-svh overflow-hidden bg-page-bg font-sans text-primary"
>
	<img
		class="hero-image absolute inset-0 -z-10 h-full w-full object-cover object-left"
		src="__HERO_IMAGE__"
		alt=""
		fetchpriority="high"
	/>
	<div
		class="pointer-events-none absolute inset-0 -z-10 bg-[linear-gradient(90deg,rgba(12,24,20,0.2),transparent_75%)]"
		aria-hidden="true"
	></div>

	<nav
		class="absolute bottom-5 right-5 z-10 flex items-center gap-3 md:bottom-8 md:right-8"
		aria-label="Social and contact links"
	>
		<a
			class="inline-flex size-12 items-center justify-center rounded-full bg-surface-alt text-primary shadow-lg transition-colors hover:bg-primary hover:text-surface-alt focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-surface-alt"
			href="https://www.instagram.com/allroadworks/"
			target="_blank"
			rel="noopener noreferrer"
			aria-label="Visit ALLROADWORKS on Instagram"
			title="Instagram: @allroadworks"
		>
			<svg
				class="size-6"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="1.8"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<rect x="3" y="3" width="18" height="18" rx="5" />
				<circle cx="12" cy="12" r="4" />
				<circle cx="17.5" cy="6.5" r="0.75" fill="currentColor" stroke="none" />
			</svg>
		</a>
		<a
			class="inline-flex size-12 items-center justify-center rounded-full bg-surface-alt text-primary shadow-lg transition-colors hover:bg-primary hover:text-surface-alt focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-surface-alt"
			href="mailto:coach@allroadworks.com"
			aria-label="Email ALLROADWORKS"
			title="Email coach@allroadworks.com"
		>
			<svg
				class="size-6"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="1.8"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true"
			>
				<rect x="3" y="5" width="18" height="14" rx="2" />
				<path d="m3 7 9 7 9-7" />
			</svg>
		</a>
	</nav>

	<section
		class="relative flex min-h-svh justify-center p-5 items-start transition-opacity duration-200 motion-reduce:transition-none md:justify-start md:p-10 lg:p-16"
		aria-labelledby="brand-title"
	>
		<div
			class="w-full max-w-2xl rounded-lg border border-surface-border bg-surface px-6 py-7 text-surface-text shadow-2xl sm:px-9 sm:py-9"
		>
			<div class="mb-5 h-1 w-12 bg-highlight" aria-hidden="true"></div>
			<h1
				id="brand-title"
				class="font-anton text-[2.5rem] leading-[0.9] tracking-normal min-[390px]:text-[2.75rem] min-[440px]:text-6xl sm:text-7xl"
			>
				ALLROADWORKS
			</h1>
			<h2
				class="mt-5 max-w-lg font-anton text-3xl leading-tight tracking-normal sm:text-4xl"
			>
				Strength Coaching for Cyclists
			</h2>
			<hr class="my-6 border-panel-border/40" />
			<p class="max-w-xl text-base leading-relaxed sm:text-lg">
				Individual strength coaching designed around your goals and your
				schedule. Build strength and fatigue resistance to ride harder for
				longer.
			</p>
			<p
				class="mt-5 text-sm font-semibold leading-relaxed text-surface-text/90 sm:text-base"
			>
				Online coaching or in-person in Mainz, Germany.
			</p>
			<nav
				class="mt-7 flex flex-wrap items-center gap-x-5 gap-y-3 text-sm font-semibold uppercase"
				aria-label="Main navigation"
			>
				<a
					class="underline decoration-accent decoration-2 underline-offset-4 hover:text-secondary"
					href="#about-me"
					>About Me</a
				>
				<a
					class="underline decoration-accent decoration-2 underline-offset-4 hover:text-secondary"
					href="#pricing"
					>Pricing</a
				>
				<a
					class="max-[442px]:ml-auto inline-flex min-h-11 items-center bg-primary px-5 text-surface-alt no-underline transition-colors hover:bg-secondary focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
					href="https://calendly.com/kpotschien/arw-intro-call"
					target="_blank"
					rel="noopener noreferrer"
				>
					Book an intro call
				</a>
			</nav>
		</div>
	</section>
</main>
