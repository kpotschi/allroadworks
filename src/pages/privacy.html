<dialog
	id="privacy"
	data-page-dialog
	class="m-auto max-h-[calc(100%-2rem)] w-[calc(100%-2rem)] max-w-2xl overflow-y-auto rounded-lg border border-surface-border bg-surface p-0 font-sans text-surface-text shadow-2xl backdrop:bg-primary/75"
>
	<article class="p-6 sm:p-10">
		<header class="mb-8 flex items-start justify-between gap-6">
			<div>
				<div class="mb-4 h-1 w-12 bg-highlight" aria-hidden="true"></div>
				<p
					class="text-xs font-semibold uppercase tracking-normal text-surface-text/70"
				>
					Allroad Works
				</p>
				<h2 class="mt-2 text-4xl font-bold leading-none font-stretch-expanded sm:text-5xl">
					Privacy Policy
				</h2>
			</div>
			<button
				class="inline-flex size-11 shrink-0 items-center justify-center border border-surface-border hover:bg-primary hover:text-surface-alt focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
				type="button"
				data-close-page
				aria-label="Close Privacy Policy"
			>
				<svg
					class="size-5"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					aria-hidden="true"
				>
					<path d="m18 6-12 12M6 6l12 12" />
				</svg>
			</button>
		</header>
		<!--
			TODO(Kevin): Replace the placeholder below with your privacy policy text
			(from your lawyer or a generator such as eRecht24) and have it checked
			before publishing. Use <h3>, <p> and <ul> inside this div.
		-->
		<div class="space-y-4 text-sm leading-relaxed sm:text-base [&_h3]:mt-6 [&_h3]:text-lg [&_h3]:font-bold">
			<p class="border-l-4 border-paprika bg-primary/5 p-4 font-semibold">
				[Insert privacy policy text]
			</p>
		</div>
	</article>
</dialog>
